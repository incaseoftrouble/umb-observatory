name: Test UMB

on:
  schedule:
    - cron: '26 8 * * *'
    # weekly: also build and test the from-source image (compiles Storm, so it is slow)
    - cron: '26 9 * * 1'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # to trigger the workflow manually
  workflow_dispatch:


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ruff
        run: |
          pip install ruff==0.16.6
          ruff check umbtest tests main.py

      - name: Run pyright
        run: |
          pip install pyright==1.1.408 pytest
          pyright

      - name: Check notebook source is well-formed
        run: |
          pip install jupytext nbformat
          python - <<'PY'
          import nbformat

          import jupytext

          nb = jupytext.read("getting_started.md")
          ipynb = jupytext.writes(nb, fmt="ipynb")
          reloaded = nbformat.reads(ipynb, as_version=4)
          assert nbformat.validate(reloaded) is None
          assert len(reloaded.cells) > 0
          print(f"notebook OK: {len(reloaded.cells)} cells")
          PY

  build:
    name: Test ${{ matrix.flavor }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 360
    strategy:
      matrix:
        flavor: ${{ fromJSON((github.event.schedule == '26 9 * * 1' || github.event_name == 'workflow_dispatch') && '["fast","source"]' || '["fast"]') }}
        runs-on: [ ubuntu-latest, ubuntu-24.04-arm ]
        include:
          - runs-on: ubuntu-latest
            platform: linux/amd64
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -  name: Build from Dockerfile
         run: docker build --build-arg FLAVOR=${{ matrix.flavor }} --build-arg no_threads=$(nproc) -t pmctools/umbi:ci .

      - name: Run Docker
        run: docker run -d -it --name ci pmctools/umbi:ci

      - name: Run tests
        run: docker exec ci bash -c "cd /opt/umb; UMB_TEST_MODELS=full python -m pytest --junit-xml=test-results.xml tests"

      - name: Build the getting-started notebook (materialize + execute)
        run: |
          docker exec ci bash -c "cd /opt/umb; \
            jupytext --to ipynb getting_started.md && \
            jupyter nbconvert --to notebook --execute --inplace getting_started.ipynb"

      - name: Download test results
        if: always()
        run: docker cp ci:/opt/umb/test-results.xml test-results.xml

      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          # A list of JUnit XML files, directories containing the former, and wildcard
          # patterns to process.
          # See @actions/glob for supported patterns.
          path: test-results.xml

          # (Optional) Add a summary of the results at the top of the report
          summary: true

          # (Optional) Select which results should be included in the report.
          # Follows the same syntax as `pytest -r`
          display-options: fEX

          # (Optional) Fail the workflow if no JUnit XML was found.
          fail-on-empty: true

          # (Optional) Title of the test results section in the workflow summary
          title: Test results
