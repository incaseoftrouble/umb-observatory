name: Publish notebook

# Executes the getting-started notebook in the published from-source image and
# publishes the result as a static web page (GitHub Pages).
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  # After the container images are published, so that the notebook runs in the image
  # that was just built (a push to main publishes both flavors).
  workflow_run:
    workflows: [ "Publish Container" ]
    types: [ completed ]
    branches: [ "main" ]
  schedule:
    # weekly, after the from-source image is rebuilt (Mondays)
    - cron: '26 12 * * 2'
  # to trigger the workflow manually
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Execute the notebook
    runs-on: ubuntu-latest
    # Only after a successful publish triggered by a push or by hand (not the daily fast build).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The notebook and umbtest come from this checkout, the tools from the image.
      - name: Execute the notebook and export it to HTML
        run: |
          mkdir -p site
          docker run --rm -v "$PWD":/src:ro -v "$PWD/site":/site ghcr.io/pmc-tools/umb-observatory:from-source bash -c '
            set -euo pipefail
            rm -rf /opt/umb/umbtest /opt/umb/resources
            cp -r /src/umbtest /src/resources /src/getting_started.md /opt/umb/
            cd /opt/umb
            jupytext --to ipynb getting_started.md
            jupyter nbconvert --to html --execute getting_started.ipynb --output-dir /site --output index.html
          '
          test -s site/index.html

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
